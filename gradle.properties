org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# ⚠️ 绝对不要在这里写 org.gradle.java.home。
#
# 这个文件是入库的，而每个人的 JDK 安装路径不同。曾经写死过本机的
# 绝对路径（org.gradle.java.home=C:/Users/.../jdk-17.0.20.1+1），
# 结果 CI 容器里 Gradle 直接在**配置阶段**就报：
#   Value 'C:/Users/...' given for org.gradle.java.home
#   Gradle property is invalid (Java home supplied is invalid)
# 构建 22 秒就挂，upload阶段被 skip，commit 附件从未产生，
# 而 App 那边只表现为「在线更新永远提示已是最新」——
# 一个纯粹由本机路径导致的失败，症状却像功能没实现。
#
# 本机指定 JDK 改用环境变量：build.gradle 里读 org.gradle.java.home
# 的替代方案是 ~/.gradle/gradle.properties（只在本机，不入库）。
